name: Update OPTN MMaT Dataset

on:
  schedule:
    # Semi-annual check on the 1st and 15th of March and September (when OPTN publishes new MMaT cohorts)
    - cron: '0 12 1,15 3,9 *'
  workflow_dispatch:
    inputs:
      optn_url:
        description: 'URL to new OPTN MMaT PDF or CSV release file (e.g. from optn.transplant.hrsa.gov)'
        required: false
        default: ''

jobs:
  update-mmat:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Run MMaT Ingestion & Validation
        run: |
          if [ -n "${{ github.event.inputs.optn_url }}" ]; then
            python3 scripts/update_mmat.py --input "${{ github.event.inputs.optn_url }}"
          else
            echo "Searching for local pdf in repository root..."
            PDF_FILE=$(ls *.pdf 2>/dev/null | head -n 1)
            if [ -n "$PDF_FILE" ]; then
              python3 scripts/update_mmat.py --input "$PDF_FILE"
            else
              echo "Checking OPTN public portal for latest report..."
              # Fallback to direct script invocation with remote fetch if configured
              python3 scripts/update_mmat.py --input "https://optn.transplant.hrsa.gov/data/view-data-reports/national-data/" || exit 0
            fi
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'
          cache: true

      - name: Verify with Flutter Tests
        run: |
          flutter pub get
          flutter test

      - name: Commit and Push Updated MMaT Assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/mmat_data.csv assets/mmat_coordinates.json assets/mmat_manifest.json
          git commit -m "chore(data): update OPTN MMaT cohort dataset and manifest" || echo "No data changes detected"
          git push origin main
